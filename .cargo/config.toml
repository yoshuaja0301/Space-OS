[alias]
xtask = "run --quiet --package xtask --"

# Kernel and user programs: static (non-PIE) executables with frame pointers so
# the panic handler can walk the stack. The per-package linker script is added
# by each package's build.rs.
#
# The crypto crates behind TLS pick SIMD backends (AES-NI, CLMUL, SSE2/AVX2) when
# they can. None of that exists here: the target is soft-float, and the kernel
# switches x87/SSE/AVX off for user space because it keeps no FPU state per
# thread. These cfgs force their portable software backends.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static", "-C", "force-frame-pointers=yes",
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft",
    "--cfg", "chacha20_force_soft", "--cfg", "poly1305_force_soft",
    "--cfg", 'curve25519_dalek_backend="serial"',
]

# AArch64 (ADR-0028): the soft-float target, for the same reason -- the kernel traps
# the FP/SIMD unit at EL1 and EL0 and keeps no FP state per thread.
[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "relocation-model=static", "-C", "force-frame-pointers=yes",
    "--cfg", "aes_force_soft", "--cfg", "polyval_force_soft",
    "--cfg", "chacha20_force_soft", "--cfg", "poly1305_force_soft",
    "--cfg", 'curve25519_dalek_backend="serial"',
]
