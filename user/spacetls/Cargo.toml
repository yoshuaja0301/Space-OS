[package]
name = "spacetls"
description = "TLS 1.3 client for Space OS programs: rustls over a spacenet connection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
test = false
bench = false

[dependencies]
spaceabi.workspace = true
libspace.workspace = true
rustls.workspace = true
rustls-rustcrypto.workspace = true
# The crypto crates reach randomness through `getrandom`; this OS answers it with
# SYS_RANDOM (see `register_custom_getrandom!` in lib.rs).
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
# Only here to switch on `force-soft` for every user of sha2 (see .cargo/config.toml).
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
